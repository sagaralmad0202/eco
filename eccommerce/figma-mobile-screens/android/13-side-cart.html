<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>ECO — Side Cart (Android)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #e8eaf6; }
  /* Background is collection page */
  .page-bg {
    position: absolute;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    z-index: 0;
  }
  .page-bg-header {
    height: 88px;
    background: #fff;
    border-bottom: 1px solid var(--n-100);
    display: flex;
    align-items: flex-end;
    padding-bottom: 8px;
    padding-left: 16px;
    font-size: 14px;
    color: var(--n-400);
    flex-shrink: 0;
  }
</style>
</head>
<body class="android">
<div class="device-shell">
  <div class="screen" style="position:relative;">
    <div class="status-bar">
      <span>9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>
    <!-- Background (dimmed page) -->
    <div style="flex:1;background:rgba(0,0,0,0.45);position:relative;" onclick="location.href='12-sale-collection.html'">
    </div>

    <!-- Bottom Sheet (Cart) -->
    <div class="a-sheet">
      <div class="a-sheet-handle"></div>
      <div class="a-sheet-head">
        <div class="a-sheet-title">Shopping Cart <span style="color:var(--n-400);font-weight:400;font-size:14px;">(3)</span></div>
        <button class="a-sheet-close" onclick="location.href='12-sale-collection.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="a-sheet-body">
        <div style="padding:0 20px;">
          <div class="cart-row">
            <div class="cart-row-img"><img src="../../src/assets/p1.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Basic Tee</div><div class="cart-row-meta">Sienna · L</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="cart-qty"><button class="cart-qty-btn">−</button><span class="cart-qty-val">1</span><button class="cart-qty-btn">+</button></div>
                <div style="font-size:14px;font-weight:700;color:var(--text-main);">$199</div>
              </div>
            </div>
          </div>
          <div class="cart-row">
            <div class="cart-row-img"><img src="../../src/assets/p2.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Basic Coahuila</div><div class="cart-row-meta">Black · XL</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="cart-qty"><button class="cart-qty-btn">−</button><span class="cart-qty-val">1</span><button class="cart-qty-btn">+</button></div>
                <div style="font-size:14px;font-weight:700;color:var(--text-main);">$99</div>
              </div>
            </div>
          </div>
          <div class="cart-row" style="border-bottom:none;">
            <div class="cart-row-img"><img src="../../src/assets/p3.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Nomad Tumbler</div><div class="cart-row-meta">White · M</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="cart-qty"><button class="cart-qty-btn">−</button><span class="cart-qty-val">1</span><button class="cart-qty-btn">+</button></div>
                <div style="font-size:14px;font-weight:700;color:var(--text-main);">$119</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="a-sheet-foot">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
          <span style="font-size:15px;font-weight:600;color:var(--text-main);">Subtotal</span>
          <span style="font-size:15px;font-weight:700;color:var(--text-main);">$417.00</span>
        </div>
        <button class="btn-eco" onclick="location.href='06-checkout.html'">Checkout →</button>
        <button class="btn-eco-outline" style="margin-top:10px;height:40px;" onclick="location.href='05-cart.html'">View Full Cart</button>
      </div>
    </div>

    <!-- Android nav stays visible -->
    <div class="android-nav-bar">
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
