<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>ECO — Sign Up (Android)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #e8eaf6; }
  .auth-body { padding: 24px 20px 32px; }
  .auth-logo { text-align:center; margin-bottom:28px; }
  .auth-headline { font-size:24px; font-weight:700; color:var(--text-main); margin-bottom:4px; }
  .auth-sub { font-size:13px; color:var(--text-muted); margin-bottom:28px; }
  .auth-form { display:flex; flex-direction:column; gap:14px; }
  .field-group { display:flex; flex-direction:column; gap:6px; }
  .auth-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .auth-link-row { text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted); }
  .auth-link-row a { color:var(--eco-brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body class="android">
<div class="device-shell">
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>

    <div class="a-top-bar">
      <button class="a-top-bar-icon" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="a-top-bar-title">Create Account</span>
    </div>

    <div class="scroll-body">
      <div class="auth-body">
        <div class="auth-logo">
          <svg width="72" height="28" viewBox="0 0 90 36" fill="none">
            <circle cx="12" cy="18" r="12" fill="#111827"/>
            <path d="M7 18l4 4 6-8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="30" y="24" font-family="Poppins,sans-serif" font-weight="700" font-size="18" fill="#111827">eco</text>
          </svg>
        </div>
        <div class="auth-headline">Create Account</div>
        <div class="auth-sub">Sign up to get started with ECO</div>

        <!-- Social Buttons -->
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
          <button class="btn-social">
            <svg viewBox="0 0 24 24" fill="none"><path d="M18 2H15C13.67 2 12.4 2.53 11.46 3.46 10.53 4.4 10 5.67 10 7v3H7v4h3v8h4v-8h3l1-4h-4V7c0-.27.1-.52.29-.71.18-.18.43-.29.71-.29h3V2z" fill="#1877F2"/></svg>
            <span>Continue with Facebook</span>
          </button>
          <button class="btn-social">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21.8 10.04H21V10H12v4h5.65c-.76 2.33-2.97 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.53 0 2.92.58 3.98 1.52L18.81 4.69C17.02 3.03 14.63 2 12 2 6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10c0-.68-.07-1.33-.2-1.96z" fill="#FFC107"/><path d="M3.15 7.35 6.44 9.75C7.33 7.55 9.48 6 12 6c1.53 0 2.92.58 3.98 1.52l2.83-2.83C17.02 3.03 14.63 2 12 2 8.16 2 4.83 4.17 3.15 7.35z" fill="#FF3D00"/><path d="M12 22c2.58 0 4.93-.99 6.7-2.6l-3.1-2.62C14.57 17.57 13.3 18 12 18c-2.6 0-4.79-1.66-5.61-3.97L3.1 16.54C4.75 19.78 8.11 22 12 22z" fill="#4CAF50"/><path d="M21.8 10.04H21V10H12v4h5.65c-.38 1.09-1.09 2.02-2.02 2.68l3.1 2.62C19.84 17.41 22 14.93 22 12c0-.68-.07-1.33-.2-1.96z" fill="#1976D2"/></svg>
            <span>Continue with Google</span>
          </button>
        </div>

        <div class="or-divider"><span>OR</span></div>

        <div class="auth-form" style="margin-top:16px;">
          <div class="auth-row2">
            <div class="field-group">
              <label class="input-label">First Name</label>
              <input class="input-eco" type="text" placeholder="John">
            </div>
            <div class="field-group">
              <label class="input-label">Last Name</label>
              <input class="input-eco" type="text" placeholder="Doe">
            </div>
          </div>
          <div class="field-group">
            <label class="input-label">Email Address</label>
            <input class="input-eco" type="email" placeholder="example@email.com">
          </div>
          <div class="field-group">
            <label class="input-label">Password</label>
            <input class="input-eco" type="password" placeholder="Min. 8 characters">
          </div>
          <div class="field-group">
            <label class="input-label">Confirm Password</label>
            <input class="input-eco" type="password" placeholder="Repeat your password">
          </div>
          <button class="btn-eco" onclick="location.href='01-home.html'">Sign Up</button>
        </div>

        <div class="auth-link-row">Already have an account? <a href="03-login.html">Sign in</a></div>
      </div>
    </div>

    <div class="android-nav-bar">
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
