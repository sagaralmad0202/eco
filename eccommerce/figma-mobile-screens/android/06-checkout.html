<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>ECO — Checkout (Android)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #e8eaf6; }
  .page-body { padding: 16px; }
  .addr-type-row { display:flex; gap:8px; margin-top:8px; }
  .addr-type-btn { flex:1; height:36px; border-radius:var(--r-full); border:1px solid var(--n-200); font-size:12px; font-weight:500; color:var(--text-main); background:#fff; cursor:pointer; font-family:var(--font); }
  .addr-type-btn.active { background:var(--eco-brand); border-color:var(--eco-brand); color:#fff; }
  .section-sep { font-size:11px; font-weight:600; color:var(--n-400); text-transform:uppercase; letter-spacing:0.6px; margin:18px 0 10px; }
  .order-preview-item { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--n-100); }
  .order-preview-item:last-child { border:none; }
</style>
</head>
<body class="android">
<div class="device-shell">
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>
    <div class="a-top-bar">
      <button class="a-top-bar-icon" onclick="location.href='05-cart.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="a-top-bar-title">Checkout</span>
    </div>

    <div class="scroll-body">
      <div class="page-body">
        <!-- Step Tabs -->
        <div class="step-tabs">
          <button class="step-tab active">Shipping</button>
          <button class="step-tab">Payment</button>
          <button class="step-tab">Confirmation</button>
        </div>

        <!-- Shipping Address Card -->
        <div class="form-card" style="margin:0 0 12px;">
          <div class="form-card-title">Shipping Address</div>
          <div class="form-stack">
            <div class="form-row2">
              <div>
                <label class="input-label" style="font-size:12px;">First Name</label>
                <input class="input-eco" type="text" value="Cole" style="height:40px;font-size:13px;">
              </div>
              <div>
                <label class="input-label" style="font-size:12px;">Last Name</label>
                <input class="input-eco" type="text" value="Enrico" style="height:40px;font-size:13px;">
              </div>
            </div>
            <div>
              <label class="input-label" style="font-size:12px;">Address</label>
              <input class="input-eco" type="text" value="123, Dream Avenue, USA" style="height:40px;font-size:13px;">
            </div>
            <div class="form-row2">
              <div>
                <label class="input-label" style="font-size:12px;">City</label>
                <input class="input-eco" type="text" value="Norris" style="height:40px;font-size:13px;">
              </div>
              <div>
                <label class="input-label" style="font-size:12px;">Postal Code</label>
                <input class="input-eco" type="text" value="2500" style="height:40px;font-size:13px;">
              </div>
            </div>
            <div class="addr-type-row">
              <button class="addr-type-btn active">Home</button>
              <button class="addr-type-btn">Office</button>
            </div>
          </div>
        </div>

        <!-- Contact Info -->
        <div class="form-card" style="margin:0 0 12px;">
          <div class="form-card-title">Contact Information</div>
          <div class="form-stack">
            <div>
              <label class="input-label" style="font-size:12px;">Phone Number</label>
              <input class="input-eco" type="tel" value="+855-666-7744" style="height:40px;font-size:13px;">
            </div>
            <div>
              <label class="input-label" style="font-size:12px;">Email Address</label>
              <input class="input-eco" type="email" value="enrico@example.com" style="height:40px;font-size:13px;">
            </div>
          </div>
        </div>

        <!-- Delivery Method -->
        <div class="form-card" style="margin:0 0 12px;">
          <div class="form-card-title">Delivery Method</div>
          <div class="delivery-opt selected">
            <div class="radio-circle checked"><div class="radio-dot"></div></div>
            <div style="flex:1;">
              <div class="delivery-name">Standard Delivery</div>
              <div class="delivery-sub">3–5 business days</div>
            </div>
            <div class="delivery-price">$5.00</div>
          </div>
          <div class="delivery-opt">
            <div class="radio-circle"></div>
            <div style="flex:1;">
              <div class="delivery-name">Express Delivery</div>
              <div class="delivery-sub">1–2 business days</div>
            </div>
            <div class="delivery-price">$15.00</div>
          </div>
        </div>

        <!-- Order Items Preview -->
        <div class="form-card" style="margin:0 0 16px;">
          <div class="form-card-title">Order Review</div>
          <div class="order-preview-item">
            <div class="order-thumb"><img src="../../src/assets/p1.webp" alt="" onerror="this.style.display='none'"></div>
            <div style="flex:1;"><div style="font-size:13px;font-weight:600;color:var(--text-main);">Basic Tee</div><div style="font-size:11px;color:var(--n-400);">Sienna · L × 1</div></div>
            <div style="font-size:13px;font-weight:700;color:var(--text-main);">$199</div>
          </div>
          <div class="order-preview-item">
            <div class="order-thumb"><img src="../../src/assets/p2.webp" alt="" onerror="this.style.display='none'"></div>
            <div style="flex:1;"><div style="font-size:13px;font-weight:600;color:var(--text-main);">Basic Coahuila</div><div style="font-size:11px;color:var(--n-400);">Black · XL × 1</div></div>
            <div style="font-size:13px;font-weight:700;color:var(--text-main);">$99</div>
          </div>
          <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--n-100);font-size:14px;font-weight:700;color:var(--text-main);">
            <span>Total</span><span>$308.00</span>
          </div>
        </div>

        <button class="btn-eco">Continue to Payment →</button>
        <div style="height:20px;"></div>
      </div>
    </div>

    <div class="android-nav-bar">
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
