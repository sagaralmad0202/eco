<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>ECO — Forgot Password (Android)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #e8eaf6; }
  .auth-body { padding: 32px 20px; text-align:center; }
  .auth-headline { font-size:22px; font-weight:700; color:var(--text-main); margin-bottom:8px; }
  .auth-desc { font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:28px; max-width:280px; margin-left:auto; margin-right:auto; }
  .field-group { display:flex; flex-direction:column; gap:6px; text-align:left; margin-bottom:14px; }
  .auth-link-row { text-align:center; margin-top:16px; font-size:13px; color:var(--text-muted); }
  .auth-link-row a { color:var(--eco-brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body class="android">
<div class="device-shell">
  <div class="screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>
    <div class="a-top-bar">
      <button class="a-top-bar-icon" onclick="location.href='03-login.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="a-top-bar-title">Reset Password</span>
    </div>

    <div class="scroll-body">
      <div class="auth-body">
        <!-- Icon -->
        <div class="auth-icon-circle" style="margin-bottom:24px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:32px;height:32px;color:var(--n-600);"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <div class="auth-headline">Forgot Password?</div>
        <div class="auth-desc">Enter your email address and we'll send you a link to reset your password.</div>

        <div class="field-group">
          <label class="input-label">Email Address</label>
          <input class="input-eco" type="email" placeholder="example@email.com">
        </div>
        <button class="btn-eco" onclick="location.href='03-login.html'">Send Reset Link</button>
        <button class="btn-eco-outline" style="margin-top:10px;" onclick="location.href='03-login.html'">Cancel</button>

        <div class="auth-link-row">Don't have an account? <a href="02-signup.html">Sign up</a></div>
      </div>
    </div>

    <div class="android-nav-bar">
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="anb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
