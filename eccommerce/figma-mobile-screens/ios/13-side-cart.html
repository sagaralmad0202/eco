<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>ECO — Side Cart (iOS)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #1c1c1e; }
</style>
</head>
<body class="ios">
<div class="device-shell">
  <div class="screen" style="position:relative;">
    <div class="status-bar" style="position:relative;z-index:2;">
      <div class="ios-notch"></div>
      <span style="font-size:15px;font-weight:600;">9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>

    <!-- Background page (dimmed) -->
    <div style="flex:1;background:rgba(0,0,0,0.5);position:relative;z-index:1;" onclick="location.href='12-sale-collection.html'">
    </div>

    <!-- iOS Page Sheet -->
    <div class="i-sheet" style="top:50px;">
      <div class="i-sheet-grabber"></div>
      <div class="i-sheet-head">
        <div class="i-sheet-title">Shopping Cart <span style="color:#8e8e93;font-weight:400;font-size:14px;">(3)</span></div>
        <button class="i-sheet-done" onclick="location.href='12-sale-collection.html'">Close</button>
      </div>
      <div class="i-sheet-body">
        <div style="padding:0 16px;">
          <div class="cart-row">
            <div class="cart-row-img"><img src="../../src/assets/p1.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Basic Tee</div><div class="cart-row-meta">Sienna · L</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="i-stepper"><button class="i-stepper-btn">−</button><div class="i-stepper-sep"></div><span class="i-stepper-val">1</span><div class="i-stepper-sep"></div><button class="i-stepper-btn">+</button></div>
                <div style="font-size:15px;font-weight:700;color:var(--text-main);">$199</div>
              </div>
            </div>
          </div>
          <div class="cart-row">
            <div class="cart-row-img"><img src="../../src/assets/p2.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Basic Coahuila</div><div class="cart-row-meta">Black · XL</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="i-stepper"><button class="i-stepper-btn">−</button><div class="i-stepper-sep"></div><span class="i-stepper-val">1</span><div class="i-stepper-sep"></div><button class="i-stepper-btn">+</button></div>
                <div style="font-size:15px;font-weight:700;color:var(--text-main);">$99</div>
              </div>
            </div>
          </div>
          <div class="cart-row" style="border-bottom:none;">
            <div class="cart-row-img"><img src="../../src/assets/p3.webp" alt="" onerror="this.style.display='none'"></div>
            <div class="cart-row-body">
              <div><div class="cart-row-name">Nomad Tumbler</div><div class="cart-row-meta">White · M</div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                <div class="i-stepper"><button class="i-stepper-btn">−</button><div class="i-stepper-sep"></div><span class="i-stepper-val">1</span><div class="i-stepper-sep"></div><button class="i-stepper-btn">+</button></div>
                <div style="font-size:15px;font-weight:700;color:var(--text-main);">$119</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="i-sheet-foot">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
          <span style="font-size:16px;font-weight:600;color:var(--text-main);">Subtotal</span>
          <span style="font-size:16px;font-weight:700;color:var(--text-main);">$417.00</span>
        </div>
        <button class="i-btn-filled" onclick="location.href='06-checkout.html'">Checkout →</button>
        <button class="i-btn-tinted" onclick="location.href='05-cart.html'" style="margin-top:10px;">View Full Cart</button>
      </div>
    </div>

    <div class="ios-home-bar" style="position:relative;z-index:55;"><div class="ios-home-pill"></div></div>
  </div>
</div>
</body>
</html>
