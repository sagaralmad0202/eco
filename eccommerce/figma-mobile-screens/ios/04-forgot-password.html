<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>ECO — Forgot Password (iOS)</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #1c1c1e; }
  .auth-body { padding: 32px 20px; text-align:center; }
  .auth-headline { font-size:24px; font-weight:700; color:var(--text-main); margin-bottom:8px; letter-spacing:-0.3px; }
  .auth-desc { font-size:14px; color:var(--text-muted); line-height:1.6; margin-bottom:28px; max-width:290px; margin-left:auto; margin-right:auto; }
  .auth-link-row { text-align:center; margin-top:16px; font-size:14px; color:var(--text-muted); }
  .auth-link-row a { color:var(--eco-brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body class="ios">
<div class="device-shell">
  <div class="screen">
    <div class="status-bar" style="position:relative;">
      <div class="ios-notch"></div>
      <span style="font-size:15px;font-weight:600;">9:41</span>
      <div class="sb-icons">
        <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="0.5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" fill="#000"/><rect x="9" y="0" width="3" height="12" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
        <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="1.5" width="20" height="9" rx="1.5" stroke="#000"/><rect x="21.5" y="4" width="3" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="14" height="6" rx="0.5" fill="#000"/></svg>
      </div>
    </div>
    <div class="i-nav-bar">
      <button class="i-nav-btn" onclick="location.href='03-login.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Login
      </button>
      <span class="i-nav-title">Reset Password</span>
      <div style="min-width:60px;"></div>
    </div>

    <div class="scroll-body">
      <div class="auth-body">
        <div class="auth-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:32px;height:32px;color:var(--n-600);"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="auth-headline">Forgot Password?</div>
        <div class="auth-desc">Enter your email and we'll send you a link to reset your password.</div>

        <div style="text-align:left;">
          <div class="i-field"><div class="i-field-label">Email Address</div><input type="email" placeholder="example@email.com"></div>
          <div style="margin-top:4px;"></div>
          <button class="i-btn-filled" onclick="location.href='03-login.html'" style="margin-top:8px;">Send Reset Link</button>
          <button class="i-btn-tinted" onclick="location.href='03-login.html'" style="margin-top:10px;">Cancel</button>
        </div>
        <div class="auth-link-row">Don't have an account? <a href="02-signup.html">Sign up</a></div>
      </div>
    </div>
    <div class="ios-home-bar"><div class="ios-home-pill"></div></div>
  </div>
</div>
</body>
</html>
