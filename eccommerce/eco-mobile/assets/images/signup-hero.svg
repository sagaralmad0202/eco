<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="phoneBody" x1="340" y1="40" x2="560" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#245276"/>
      <stop offset="0.55" stop-color="#173E60"/>
      <stop offset="1" stop-color="#0E2C45"/>
    </linearGradient>
    <linearGradient id="screen" x1="351" y1="51" x2="549" y2="499" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset="1" stop-color="#F5F4EC"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="450" y1="160" x2="450" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F8F1"/>
      <stop offset="1" stop-color="#E4EFE5"/>
    </linearGradient>
    <linearGradient id="leafDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D7D64"/>
      <stop offset="1" stop-color="#2E5A45"/>
    </linearGradient>
    <linearGradient id="leafMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DBCA4"/>
      <stop offset="1" stop-color="#6E9A7D"/>
    </linearGradient>
    <linearGradient id="leafSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3E2D2"/>
      <stop offset="1" stop-color="#B2CDB7"/>
    </linearGradient>
    <linearGradient id="potFill" x1="210" y1="443" x2="304" y2="522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5CBA7"/>
      <stop offset="1" stop-color="#D3B086"/>
    </linearGradient>
    <filter id="phoneShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0E2C45" flood-opacity="0.22"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E2C45" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="230%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0E2C45" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- warm sun + quiet rings -->
  <circle cx="731" cy="121" r="54" fill="#F1E1C2" opacity="0.9"/>
  <circle cx="731" cy="121" r="72" fill="none" stroke="#D9C7A5" stroke-width="1.6" opacity="0.55"/>
  <path d="M160 366C119 260 198 158 317 143" fill="none" stroke="#8FAF9B" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.55"/>
  <path d="M610 470C706 450 760 390 774 306" fill="none" stroke="#8FAF9B" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.45"/>

  <!-- phone -->
  <g filter="url(#phoneShadow)">
    <rect x="342" y="38" width="216" height="474" rx="45" fill="url(#phoneBody)"/>
    <rect x="352" y="48" width="196" height="454" rx="37" fill="url(#screen)"/>
    <rect x="355" y="51" width="190" height="448" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4"/>
    <rect x="414" y="61" width="72" height="17" rx="8.5" fill="#0F314D"/>
    <circle cx="472" cy="69.5" r="2.8" fill="#3F6887"/>
    <rect x="340" y="132" width="3.6" height="34" rx="1.8" fill="#0C263C"/>
    <rect x="340" y="180" width="3.6" height="46" rx="1.8" fill="#0C263C"/>
    <rect x="556.5" y="158" width="3.6" height="62" rx="1.8" fill="#0C263C"/>
  </g>

  <!-- phone screen content -->
  <g>
    <circle cx="450" cy="113" r="15" fill="#E1EDE1"/>
    <path d="M450 104C455 106 458 110 457 115C456 120 451 122 447 119C443 116 443 110 450 104Z" fill="#2E5A45"/>
    <path d="M450 104C448 109 447 114 447 119" fill="none" stroke="#F6FAF4" stroke-width="1.3" stroke-linecap="round"/>

    <path d="M450 151L503 171V219C503 257 479 284 450 296C421 284 397 257 397 219V171L450 151Z" fill="url(#shieldFill)" stroke="#173E60" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M450 166L490 181V219C490 247 473 268 450 278C427 268 410 247 410 219V181L450 166Z" fill="none" stroke="#C5D9C8" stroke-width="1.6"/>
    <path d="M427 220L444 237L476 200" fill="none" stroke="#2E5A45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="410" y="319" width="80" height="8" rx="4" fill="#CBD5CB"/>
    <rect x="390" y="337" width="120" height="6" rx="3" fill="#E2E6DF"/>
    <rect x="404" y="351" width="92" height="6" rx="3" fill="#E2E6DF"/>

    <rect x="393" y="383" width="114" height="32" rx="16" fill="#173E60"/>
    <path d="M434 399H466" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M459 393L466 399L459 405" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="382" y="444" width="136" height="1.5" rx="0.75" fill="#E5E8E1"/>
    <circle cx="418" cy="468" r="4" fill="#D5DED5"/>
    <circle cx="436" cy="468" r="4" fill="#D5DED5"/>
    <circle cx="454" cy="468" r="4" fill="#D5DED5"/>
    <circle cx="472" cy="468" r="4" fill="#173E60"/>
    <circle cx="490" cy="468" r="4" fill="#D5DED5"/>
  </g>

  <!-- verified floating badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="590" cy="176" r="43" fill="#FFFFFF"/>
    <circle cx="590" cy="176" r="43" fill="none" stroke="#E6ECE4" stroke-width="1.5"/>
    <path d="M590 150L608 157V172C608 186 601 197 590 203C579 197 572 186 572 172V157L590 150Z" fill="#E2EEE2" stroke="#173E60" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M581 173L587 179L600 166" fill="none" stroke="#2E5A45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating order card -->
  <g filter="url(#cardShadow)">
    <rect x="206" y="236" width="102" height="74" rx="18" fill="#FFFFFF"/>
    <circle cx="234" cy="262" r="13" fill="#E6EFE6"/>
    <path d="M234 254L242 257V264C242 270 239 274 234 277C229 274 226 270 226 264V257L234 254Z" fill="#2E5A45"/>
    <rect x="255" y="254" width="38" height="5" rx="2.5" fill="#D4DDD4"/>
    <rect x="255" y="266" width="28" height="4" rx="2" fill="#E6EAE2"/>
    <rect x="224" y="286" width="66" height="4" rx="2" fill="#E6EAE2"/>
    <rect x="224" y="295" width="46" height="4" rx="2" fill="#EDF0E8"/>
  </g>

  <!-- sparkles -->
  <path d="M700 252V274M689 263H711" stroke="#2E5A45" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M180 186V202M172 194H188" stroke="#6E9A7D" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <circle cx="688" cy="395" r="4.5" fill="#D9A97F" opacity="0.75"/>
  <circle cx="169" cy="308" r="3.5" fill="#8FAF9B" opacity="0.8"/>
  <circle cx="735" cy="330" r="2.6" fill="#173E60" opacity="0.35"/>
  <circle cx="318" cy="212" r="2.6" fill="#173E60" opacity="0.28"/>
</svg>
