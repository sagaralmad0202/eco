openapi: 3.0.3
info:
  title: E-Commerce REST API
  description: E-Commerce platform API documentation built with Express, Prisma, and PostgreSQL.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      description: Returns health status of the API and database connectivity.
      tags:
        - System
      responses:
        '200':
          description: API is healthy and connected to database
        '503':
          description: Database disconnected or degraded
  /auth/register:
    post:
      summary: Register new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: User logged in, tokens returned
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      responses:
        '200':
          description: New access token returned
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '200':
          description: Successfully logged out
  /products:
    get:
      summary: List products
      tags:
        - Products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
  /products/{id}:
    get:
      summary: Get product details by ID or slug
      tags:
        - Products
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found
  /cart:
    get:
      summary: Get current user cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart contents
    post:
      summary: Add item to cart
      tags:
        - Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Updated cart
  /wishlist:
    get:
      summary: Get user wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wishlist items
    post:
      summary: Add product to wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
      responses:
        '200':
          description: Added to wishlist
  /orders:
    get:
      summary: Get user order history
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user orders
    post:
      summary: Create order from cart
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created
  /payments/razorpay/create-order:
    post:
      summary: Create Razorpay order
      tags:
        - Payments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Razorpay order details
  /contact:
    post:
      summary: Submit contact message
      tags:
        - Contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                message:
                  type: string
      responses:
        '201':
          description: Message received
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
